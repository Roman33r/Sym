<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Город вместе</title>
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; background: #1d2330; color: #eee; display: flex; flex-direction: column; height: 100vh; }
  #top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 6px 12px; background: #161b26; border-bottom: 1px solid #333b4d; }
  #top .logo { color: #f0a830; font-weight: 800; letter-spacing: .5px; text-transform: uppercase; font-size: 17px; }
  #top .date { font-family: monospace; font-size: 14px; color: #dde; }
  #main { flex: 1; display: flex; gap: 12px; padding: 12px; min-height: 0; }
  .ic { width: 16px; height: 16px; vertical-align: -3px; }
  button .ic { width: 18px; height: 18px; }
  #map { flex: 1; overflow: auto; border: 1px solid #445; border-radius: 6px; background: #142; }
  #side { width: 270px; flex: none; overflow-y: auto; }
  button { display: block; width: 100%; margin: 2px 0; padding: 5px 8px; text-align: left; background: #2c3446; color: #eee; border: 1px solid #445; border-radius: 4px; cursor: pointer; }
  button.sel { background: #3d7a4f; border-color: #6c6; }
  button small { color: #aab; }
  #zoom button { display: inline-block; width: 32px; text-align: center; margin: 0 1px; }
  #tabs { margin: 8px 0 2px; border-bottom: 1px solid #445; }
  #tabs button { display: inline-block; width: auto; margin: 0 1px -1px 0; padding: 4px 5px; text-align: center; border-radius: 4px 4px 0 0; font-size: 12px; }
  #tabs button.on { background: #3a4660; border-color: #8ab; border-bottom-color: #3a4660; }
  .up { color: #7d7; } .down { color: #f88; }
  canvas { display: block; cursor: crosshair; }
  #res { display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; }
  #info, #log { font-size: 12px; color: #bbc; min-height: 32px; }
  #err { color: #f77; min-height: 18px; }
  #phase:empty, #level:empty, #invite:empty { display: none; }
  #level { background: #23303a; border: 1px solid #4a6a7a; border-radius: 6px; padding: 8px; margin: 6px 0; font-size: 13px; line-height: 1.5; }
  #level button { margin-top: 6px; text-align: center; background: #3d6a7a; }
  #level button:disabled { opacity: .5; cursor: default; }
  .locked { opacity: .45; }
  #res [data-res] { white-space: nowrap; cursor: help; }
  .pop { position: fixed; display: none; z-index: 10; width: 260px; background: #11161f; border: 1px solid #556; border-radius: 6px; padding: 8px; font-size: 12px; line-height: 1.5; box-shadow: 0 4px 16px #0008; pointer-events: none; }
  .pop hr { border: 0; border-top: 1px solid #445; margin: 4px 0; }
  .pop b { font-size: 13px; }
  #speed button { display: inline-block; width: auto; padding: 3px 9px; margin: 0 1px; text-align: center; }
  #speed button.on { background: #3d7a4f; border-color: #6c6; }
  #invite, #netbox .box { background: #262e3e; border: 1px solid #556; border-radius: 6px; padding: 8px; margin: 6px 0; font-size: 13px; }
  textarea { width: 100%; box-sizing: border-box; height: 70px; background: #11161f; color: #ddd; border: 1px solid #556; border-radius: 4px; font: 11px monospace; }
  #netbox { position: fixed; inset: 0; background: #0b0f17e6; display: none; align-items: center; justify-content: center; z-index: 20; }
  #netbox .box { width: min(440px, calc(100vw - 32px)); padding: 16px; line-height: 1.5; }
  #netbox button { text-align: center; margin: 6px 0; }
  .mrow { margin: 4px 0; }
  .mrow button { display: inline-block; width: auto; margin-left: 4px; padding: 3px 7px; }
  #phase { background: #3a3320; border: 1px solid #a83; border-radius: 6px; padding: 8px; margin: 6px 0; font-size: 13px; line-height: 1.5; }
  #phase button { margin-top: 6px; text-align: center; background: #3d7a4f; }
  h4 { margin: 10px 0 4px; }
</style>
</head>
<body>
<header id="top">
  <span class="logo">Город вместе</span>
  <div id="speed"><button data-v="0" title="Пауза"><img class="ic" src="icons/pause.svg?v=9" alt="Пауза"></button><button data-v="1" title="Скорость ×1"><img class="ic" src="icons/play.svg?v=9" alt="×1"></button><button data-v="2" title="Скорость ×2"><img class="ic" src="icons/fast.svg?v=9" alt="×2"></button><button data-v="4" title="Скорость ×4"><img class="ic" src="icons/faster.svg?v=9" alt="×4"></button></div>
  <span id="tickN" class="date"></span>
  <button id="commBtn" title="Показать ЛЭП, водопровод и куда доходят электричество и вода" style="width:auto"><img class="ic" src="icons/power.svg?v=9" alt=""> Коммуникации</button>
  <div id="res"></div>
  <div id="zoom" title="Масштаб (или Ctrl+колесо)"><button id="zout" aria-label="Уменьшить">−</button><button id="zin" aria-label="Увеличить">+</button></div>
</header>
<div id="main">
<div id="map"><canvas id="c"></canvas></div>
<div id="side">
  <label>Имя: <input id="name" maxlength="20" style="width:150px"></label>
  <div id="phase"></div>
  <div id="level"></div>
  <div id="tools"></div>
  <div id="err"></div>
  <div id="tip" class="pop" role="tooltip"></div>
  <div id="hc" class="pop" role="tooltip"></div>
  <div id="info">ЛКМ — строить (дороги и линии можно тянуть, зоны — выделять прямоугольником), ПКМ — снести. Колесо / Shift+колесо — прокрутка, Ctrl+колесо — масштаб.</div>
  <div id="invite"></div>
  <h4>Игроки</h4><div id="players"></div>
  <h4>События</h4><div id="log"></div>
  <button id="restart" style="margin-top:12px;text-align:center"><img class="ic" src="icons/restart.svg?v=9" alt=""> Новый город</button>
</div>
</div>
<div id="netbox"><div class="box" id="netStep"></div></div>
<!-- ?v= must change with every release: GitHub Pages lets browsers cache files for 10 minutes, and a new page with an old game.js breaks -->
<script src="game.js?v=9"></script>
<script>
// W, H, B, NEED_TEXT, POWER, WATER are globals from game.js
// show script errors instead of a silently frozen game (e.g. a stale cached game.js)
window.onerror = m => { const e = document.getElementById('err'); if (e) e.textContent = 'Ошибка: ' + m + ' — обновите страницу (Ctrl+F5)'; };
let S = 20; // zoom: half the width of a tile diamond, in pixels
const c = document.getElementById('c'), ctx = c.getContext('2d');
// the map is painted to an offscreen canvas on each state update; mouse moves only redraw the overlay
const base = document.createElement('canvas'), bx = base.getContext('2d');
const $ = id => document.getElementById(id);
let st = null, tool = 'info', hover = -1, drag = false, last = -1, sel = -1, mx = 0, my = 0;

let name = '', net = null; // net.send(command) → Promise of an error text or null
try { name = localStorage.getItem('city-name') || ''; } catch {}
// players are identified by name, so a generated one must survive a page reload
if (!name) { name = 'Гость' + (Math.random() * 1000 | 0); try { localStorage.setItem('city-name', name); } catch {} }
$('name').value = name;
$('name').onchange = () => {
  name = $('name').value.trim().slice(0, 20) || name;
  try { localStorage.setItem('city-name', name); } catch {}
  if (net) net.rename();
};

const ic = n => `<img class="ic" src="icons/${n}.svg?v=9" alt="">`; // emoji don't render in every browser, so icons are SVG files
const RES = { money: 'money', wood: 'wood', stone: 'stone', food: 'food', iron: 'iron', gold: 'gold' };
const costText = c => Object.entries(c).map(([k, v]) => v + ic(RES[k])).join(' ');
const TOOLS = { info: { label: 'Информация', icon: 'info', cost: {} }, buy: { label: 'Купить землю', icon: 'buy', cost: {} }, clear: { label: 'Расчистить', icon: 'clear', cost: {}, note: 'лес 5' + ic('money') + ', камень 10' + ic('money') }, ...B, bulldoze: { label: 'Снести', icon: 'bulldoze', cost: { money: 2 } } };
const TABS = [['Сети', ['road', 'power', 'pipe', 'stop']], ['Зоны', ['zres', 'zoff', 'zind']], ['Жильё', ['house', 'shop', 'park']],
  ['Добыча', ['farm', 'sawmill', 'quarry', 'mine', 'depot']], ['Энергия', ['plant', 'pump']], ['Рынок', 'market']];
const toolBtn = k => {
  const b = TOOLS[k], el = document.createElement('button');
  el.dataset.tool = k;
  el.innerHTML = `${ic(b.icon || k)} ${b.label} <small>${b.note || costText(b.cost)}</small>`;
  el.onclick = () => {
    tool = k; document.querySelectorAll('[data-tool]').forEach(x => x.classList.toggle('sel', x === el));
    if (k === 'power' || k === 'pipe') setComm(true); // laying networks: show them
  };
  if (k === tool) el.classList.add('sel');
  return el;
};
$('tools').append(toolBtn('info'), toolBtn('buy'), toolBtn('clear'), toolBtn('bulldoze'));
function marketPanel() {
  const d = document.createElement('div');
  const row = (k, v, sell) => `<div class="mrow">${ic(RES[k])} ${v}${ic('money')} за шт.` +
    [10, 50].map(n => `<button data-trade="${k}:${n}:${sell ? 1 : 0}">${sell ? '−' : '+'}${n} <small>${n * v}</small></button>`).join('') + '</div>';
  d.innerHTML = '<b>Купить</b>' + Object.entries(PRICES).map(([k, v]) => row(k, v, false)).join('') +
    '<b>Продать</b>' + Object.entries(SELL).map(([k, v]) => row(k, v, true)).join('');
  d.onclick = e => {
    const b = e.target.closest('[data-trade]'); if (!b) return;
    const [res, n, sell] = b.dataset.trade.split(':');
    msg({ type: 'trade', res, n: +n, sell: sell === '1' });
  };
  return d;
}
const tabBar = document.createElement('div'), panel = document.createElement('div');
tabBar.id = 'tabs';
TABS.forEach(([title, keys], n) => {
  const tb = document.createElement('button');
  tb.textContent = title;
  tb.onclick = () => {
    tabBar.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === tb));
    panel.replaceChildren(...(keys === 'market' ? [marketPanel()] : keys.map(toolBtn)));
    locks();
  };
  tabBar.appendChild(tb);
  if (!n) tb.onclick();
});
$('tools').append(tabBar, panel);

// ---- Isometric map. A tile is a diamond 2S wide and S tall; heights are in units of S.
// P(x, y, z) turns tile coordinates (fractions allowed) and a height into a canvas point.
let OX = 0, OY = 0; // where tile (0, 0) sits, set by setZoom
const MT = 5; // room above the map for tall buildings, in S
const MAXH = 4.5; // nothing is drawn higher than this above its tile (offices, smoke)
const P = (x, y, z = 0) => [OX + (x - y) * S, OY + (x + y) * S / 2 - z * S];
let gx = null; // context the shape helpers draw into: the map layer, or the screen for traffic
// tintK darkens every colour drawn through the helpers (free land, communications mode) instead of an overlay,
// which would show seams where diamonds meet
let tintK = 1;
function tint(c) {
  if (tintK === 1) return c;
  let m;
  if (c[0] === '#') return shade(c, tintK);
  if ((m = c.match(/^rgba?\(([\d.]+),\s*([\d.]+),\s*([\d.]+)(?:,\s*([\d.]+))?\)/))) return `rgba(${m[1] * tintK | 0},${m[2] * tintK | 0},${m[3] * tintK | 0},${m[4] ?? 1})`;
  if ((m = c.match(/^hsl\(([\d.]+),\s*([\d.]+)%,\s*([\d.]+)%\)/))) return `hsl(${m[1]},${m[2]}%,${m[3] * tintK}%)`;
  return c;
}
const poly = (col, pts) => { gx.fillStyle = tint(col); gx.beginPath(); pts.forEach(([a, b], k) => (k ? gx.lineTo(a, b) : gx.moveTo(a, b))); gx.closePath(); gx.fill(); };
const line = (col, w, a, b, dash) => { gx.strokeStyle = tint(col); gx.lineWidth = w; gx.setLineDash(dash || []); gx.beginPath(); gx.moveTo(...a); gx.lineTo(...b); gx.stroke(); gx.setLineDash([]); };
const dot = (col, [x, y], r) => { gx.fillStyle = tint(col); gx.beginPath(); gx.arc(x, y, r, 0, 7); gx.fill(); };
const oval = (col, [x, y], rx, ry) => { gx.fillStyle = tint(col); gx.beginPath(); gx.ellipse(x, y, rx, ry, 0, 0, 7); gx.fill(); };
const shade = (hex, k) => { const n = parseInt(hex.slice(1), 16), f = v => Math.round(Math.min(255, v * k)); return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`; };
// flat quad over the tile-space rectangle x0..x1, y0..y1 at height z
const flat = (x0, y0, x1, y1, z, col) => poly(col, [P(x0, y0, z), P(x1, y0, z), P(x1, y1, z), P(x0, y1, z)]);
// a tile's ground, a little larger than the tile so antialiased edges of neighbours don't leave seams
const groundFill = (x, y, col) => flat(x - 0.02, y - 0.02, x + 1.02, y + 1.02, 0, col);
// a box: the two faces turned to the viewer (along y1 and x1) and the top; light comes from the back left
function block(x0, y0, x1, y1, h, col, z0 = 0) {
  poly(shade(col, 0.82), [P(x0, y1, z0), P(x1, y1, z0), P(x1, y1, z0 + h), P(x0, y1, z0 + h)]);
  poly(shade(col, 0.64), [P(x1, y0, z0), P(x1, y1, z0), P(x1, y1, z0 + h), P(x1, y0, z0 + h)]);
  flat(x0, y0, x1, y1, z0 + h, shade(col, 1.06));
}
// pyramid roof over a box top
function roof(x0, y0, x1, y1, z, h, col) {
  const ap = P((x0 + x1) / 2, (y0 + y1) / 2, z + h), a = P(x0, y0, z), b = P(x1, y0, z), cc = P(x1, y1, z), d = P(x0, y1, z);
  poly(shade(col, 1.12), [d, a, ap]); poly(shade(col, 1.0), [a, b, ap]); poly(shade(col, 0.66), [b, cc, ap]); poly(shade(col, 0.84), [cc, d, ap]);
}
// window grid on the front-left face (along y1) and the front-right face (along x1) of a box
function windows(x0, y0, x1, y1, z0, h, rows, cols, col) {
  const wz = h / rows;
  for (let r = 0; r < rows; r++) for (let k = 0; k < cols; k++) {
    const za = z0 + r * wz + wz * 0.28, zb = za + wz * 0.42;
    const ua = x0 + (x1 - x0) * (k + 0.25) / cols, ub = x0 + (x1 - x0) * (k + 0.75) / cols;
    poly(col, [P(ua, y1, za), P(ub, y1, za), P(ub, y1, zb), P(ua, y1, zb)]);
    const va = y0 + (y1 - y0) * (k + 0.25) / cols, vb = y0 + (y1 - y0) * (k + 0.75) / cols;
    poly(shade(col.startsWith('#') ? col : '#bfe3ff', 0.8), [P(x1, va, za), P(x1, vb, za), P(x1, vb, zb), P(x1, va, zb)]);
  }
}

// stable per-tile pseudo-random value so textures don't flicker between redraws
const rnd = (i, k = 0) => { const v = Math.sin(i * 12.9898 + k * 78.233) * 43758.5453; return v - Math.floor(v); };
const D = [[-1, 0], [1, 0], [0, -1], [0, 1]];
const nbr = (i, dx, dy) => { const x = i % W + dx, y = ((i / W) | 0) + dy; return x >= 0 && y >= 0 && x < W && y < H ? y * W + x : -1; };
const pick = (i, arr) => arr[(rnd(i, 11) * arr.length) | 0];
// strip of width w along the tile edge facing neighbour (dx, dy)
const edge = (x, y, dx, dy, w, col, z = 0) => flat(dx > 0 ? x + 1 - w : x, dy > 0 ? y + 1 - w : y, dx < 0 ? x + w : x + 1, dy < 0 ? y + w : y + 1, z, col);
const edges = (i, w, col, same, border = true) => {
  const x = i % W, y = (i / W) | 0;
  for (const [dx, dy] of D) { const j = nbr(i, dx, dy); if (j < 0 ? border : !same(st.grid[j])) edge(x, y, dx, dy, w, col); }
};

// smooth grass shade per tile: two octaves of value noise, so meadows have soft light and dark patches
const gnoise = new Float32Array(W * H);
{
  const h = (x, y) => rnd(x * 7919 + y * 104729, 5);
  const vn = (u, v) => {
    const x = Math.floor(u), y = Math.floor(v), fx = u - x, fy = v - y, a = fx * fx * (3 - 2 * fx), b = fy * fy * (3 - 2 * fy);
    const p = h(x, y), q = h(x + 1, y), r = h(x, y + 1), s = h(x + 1, y + 1);
    return p + (q - p) * a + (r - p) * b + (p - q - r + s) * a * b;
  };
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) gnoise[y * W + x] = vn(x / 6, y / 6) * 0.7 + vn(x / 1.5, y / 1.5) * 0.3;
}
const grassCol = i => { const n = gnoise[i]; return `rgb(${66 + n * 34 | 0},${112 + n * 42 | 0},${42 + n * 18 | 0})`; };

// zone districts: neighbouring tiles of one zone share ground and one outline
const FAM = { zres: 'res', res: 'res', zoff: 'off', off: 'off', zind: 'ind', ind: 'ind' };
const ZCOL = { res: '110,215,120', off: '100,160,250', ind: '235,195,70' };

let depth = [];
function lakeDepth() {
  const d = st.grid.map(t => t === 'lake' ? 99 : 0), q = d.flatMap((v, i) => v ? [] : [i]);
  for (let h = 0; h < q.length; h++) for (const [dx, dy] of D) {
    const j = nbr(q[h], dx, dy);
    if (j >= 0 && d[j] > d[q[h]] + 1) { d[j] = d[q[h]] + 1; q.push(j); }
  }
  return d;
}

// ground of a tile: grass, water, road, zone lot, field
function ground(i) {
  const t = st.grid[i], x = i % W, y = (i / W) | 0, f = FAM[t];
  if (t === 'lake') {
    const dp = Math.min(depth[i], 5);
    groundFill(x, y, `hsl(${208 + dp * 2},${50 + dp * 3}%,${52 - dp * 5 + rnd(i) * 3}%)`);
    edges(i, 0.16, '#dccb8c', n => n === 'lake', false);
    edges(i, 0.24, 'rgba(255,255,255,.18)', n => n === 'lake', false);
    if (rnd(i, 3) < 0.5) line('rgba(255,255,255,.35)', 1, P(x + 0.3, y + 0.5), P(x + 0.55, y + 0.5));
    return;
  }
  if (t === 'road') {
    groundFill(x, y, '#45474e');
    edges(i, 0.1, '#a5a7aa', n => n === 'road');
    for (const [dx, dy] of D) {
      const j = nbr(i, dx, dy);
      if (j >= 0 && st.grid[j] === 'road') line('#e8c547', Math.max(1, S / 16), P(x + 0.5, y + 0.5), P(x + 0.5 + dx / 2, y + 0.5 + dy / 2), [S / 6, S / 6]);
    }
    return;
  }
  if (f) {
    groundFill(x, y, f === 'res' ? shade(grassColHex(i), 1.12) : f === 'off' ? '#a3a6a4' : '#8a867c');
    if (B[t].zone) { // still empty: dashed inner outline, grey while it can't grow
      gx.strokeStyle = `rgba(${st.status[i] ? '170,170,170' : ZCOL[f]},.8)`; gx.lineWidth = 1; gx.setLineDash([3, 3]); gx.beginPath();
      [P(x + 0.2, y + 0.2), P(x + 0.8, y + 0.2), P(x + 0.8, y + 0.8), P(x + 0.2, y + 0.8)].forEach((p, k) => (k ? gx.lineTo(...p) : gx.moveTo(...p)));
      gx.closePath(); gx.stroke(); gx.setLineDash([]);
    }
    edges(i, 0.06, `rgb(${ZCOL[f]})`, n => FAM[n] === f, false);
    return;
  }
  groundFill(x, y, grassCol(i));
  if (t === 'farm') {
    flat(x + 0.06, y + 0.06, x + 0.94, y + 0.94, 0, '#8a6a3a');
    for (let r = 0; r < 4; r++) flat(x + 0.1, y + 0.12 + r * 0.2, x + 0.9, y + 0.2 + r * 0.2, 0, '#d9b44a');
  } else if (t === 'park') {
    flat(x + 0.04, y + 0.04, x + 0.96, y + 0.96, 0, '#4f9a3c');
    flat(x + 0.44, y + 0.04, x + 0.56, y + 0.96, 0, '#d8c79a'); flat(x + 0.04, y + 0.44, x + 0.96, y + 0.56, 0, '#d8c79a');
  } else if (t === 'quarry') {
    flat(x + 0.08, y + 0.08, x + 0.92, y + 0.92, 0, '#9a958b');
    flat(x + 0.22, y + 0.22, x + 0.78, y + 0.78, 0, '#827d73');
    flat(x + 0.36, y + 0.36, x + 0.64, y + 0.64, 0, '#68645d');
  } else {
    for (let k = 0; k < 3; k++) { const p = P(x + rnd(i, k + 2), y + rnd(i, k + 7)); gx.fillStyle = 'rgba(30,70,20,.45)'; gx.fillRect(p[0], p[1] - S * 0.12, 1, S * 0.12); }
  }
}
const grassColHex = i => { const n = gnoise[i]; const h = v => (v | 0).toString(16).padStart(2, '0'); return '#' + h(66 + n * 34) + h(112 + n * 42) + h(42 + n * 18); };

function tree(i, x, y, k) {
  const fx = x + 0.2 + rnd(i, k) * 0.6, fy = y + 0.2 + rnd(i, k + 3) * 0.6, r = S * (0.2 + rnd(i, k + 6) * 0.1), g0 = P(fx, fy);
  oval('rgba(0,0,0,.25)', [g0[0] + r * 0.4, g0[1]], r * 0.9, r * 0.45);
  gx.fillStyle = '#6b4a2a'; gx.fillRect(g0[0] - S * 0.03, g0[1] - S * 0.3, S * 0.06, S * 0.3);

function utils(i) {
  const g = st.grid, x = i % W, y = (i / W) | 0;
  if (comm) {
    const b = B[g[i]];
    if (b && b.needs) { // two marks at the front corner: electricity, water; filled = has it, outline = needs it but has none
      for (const [need, set, color, a] of [['p', nets.powered, '#ffd23f', 0.62], ['w', nets.watered, '#4fc3f7', 0.82]]) {
        if (!b.needs.includes(need)) continue;
        const pts = [P(x + a, y + 0.86), P(x + a + 0.12, y + 0.86), P(x + a + 0.12, y + 0.98), P(x + a, y + 0.98)];
        if (set.has(i)) poly(color, pts);

      }
    }
    for (const [bit, color, off] of [[POWER, '#ffd23f', -0.12], [WATER, '#4fc3f7', 0.12]]) {
      if (!(st.util[i] & bit)) continue;
      const cx = x + 0.5 + off, cy = y + 0.5 - off, z = bit === POWER ? 0.06 : 0.03;
      for (const [dx, dy] of D) {

// land overlay on the ground: free land is dimmed, owned land gets a border in the owner's colour where the owner changes
function landTile(i) {

  if (!o) return; // free land is drawn darker in drawTile
  for (const [dx, dy] of D) { const j = nbr(i, dx, dy); if (j < 0 || st.owner[j] !== o) edge(x, y, dx, dy, 0.05, st.players[o].color); }
}

function drawTile(i) {

  tintK = comm ? 0.45 : st.owner[i] ? 1 : 0.72; // communications mode dims the town so the networks stand out

// canvas box a tile's drawing can reach: its diamond plus everything up to MAXH above it
const tileBox = i => { const x = i % W, y = (i / W) | 0; return [OX + (x - y - 1) * S, OY + (x + y) * S / 2 - MAXH * S, 2 * S, MAXH * S + S]; };
const BG = '#16201a';

// Redraws only tiles whose look changed since the last paint. In isometry a tile's drawing overlaps the tiles
// around and behind it, so each changed spot is cleared and every tile reaching into it is drawn again, back to front.
let painted = null; // per tile: what it was drawn from
const order = []; // tiles back to front
for (let s2 = 0; s2 < W + H - 1; s2++) for (let x = Math.max(0, s2 - H + 1); x <= Math.min(W - 1, s2); x++) order.push((s2 - x) * W + x);
function paint(full = false) {
  const n = st.grid.length, sig = new Array(n);
  for (let i = 0; i < n; i++) sig[i] = st.grid[i] + '|' + st.util[i] + '|' + st.status[i] + '|' + st.owner[i];
  if (comm) nets = Game.networks(st);
  let dirty = [];
  if (!full && painted) {
    const d = new Set();
    for (let i = 0; i < n; i++) if (sig[i] !== painted[i]) {
      if (st.grid[i] === 'lake' || painted[i].startsWith('lake|')) full = true; // shores and depth spread further
      d.add(i);
      for (const [dx, dy] of D) { const j = nbr(i, dx, dy); if (j >= 0) d.add(j); }
    }
    dirty = [...d];
  }
  if (full || !painted) { depth = lakeDepth(); full = true; }
  painted = sig;
  if (full || dirty.length) trafficRebuild();
  gx = bx;
  if (full) {
    bx.fillStyle = BG; bx.fillRect(0, 0, base.width, base.height);
    for (const i of order) drawTile(i);
  } else if (dirty.length > 400) return paint(true);
  else for (const d of dirty) {
    const [bx0, by0, bw, bh] = tileBox(d), dx0 = d % W, dy0 = (d / W) | 0, hit = [];
    for (let y = Math.max(0, dy0 - 10); y <= Math.min(H - 1, dy0 + 10); y++) for (let x = Math.max(0, dx0 - 10); x <= Math.min(W - 1, dx0 + 10); x++) {
      const [ax, ay, aw, ah] = tileBox(y * W + x);
      if (ax < bx0 + bw && ax + aw > bx0 && ay < by0 + bh && ay + ah > by0) hit.push(y * W + x);
    }
    hit.sort((a, b) => ((a % W) + (a / W | 0)) - ((b % W) + (b / W | 0)) || (a % W) - (b % W));
    bx.save(); bx.beginPath(); bx.rect(bx0, by0, bw, bh); bx.clip();
    bx.fillStyle = BG; bx.fillRect(bx0, by0, bw, bh);

}

// rectangle between zone-drag start and the hovered tile, in tile coords

// outline (and optional fill) of the tile-space rectangle x0..x1, y0..y1 on the screen layer
function outline(x0, y0, x1, y1, stroke, fillCol, w = 2) {

function draw() {
  if (!st) return;
  // only the visible part of the map: this runs every frame
  const m = $('map'), vx = m.scrollLeft, vy = m.scrollTop, vw = Math.min(m.clientWidth, c.width - vx), vh = Math.min(m.clientHeight, c.height - vy);
  if (vw > 0 && vh > 0) ctx.drawImage(base, vx, vy, vw, vh, vx, vy, vw, vh);
  drawTraffic(vx, vy, vw, vh);
  if (sel >= 0) {
    const clr = tool === 'clear', buy = tool === 'buy', [x0, y0, x1, y1] = selRect(), col = buy ? '255,225,80' : clr ? '235,140,60' : ZCOL[B[tool].zone];
    const price = buy && st.players[name] ? Game.landPrice(st, name) : 0;
    let cost = 0, n = 0;
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const k = y * W + x, t = st.grid[k], fits = buy ? !Game.ownerOf(st, k) : Game.ownerOf(st, k) === name && (clr ? !!CLEAR[t] : t === 'grass');
      if (fits) { n++; cost += buy ? price : clr ? CLEAR[t].cost : 10; }
    }
    outline(x0, y0, x1 + 1, y1 + 1, `rgb(${col})`, `rgba(${col},.3)`);
    $('info').innerHTML = `${TOOLS[tool].label}: ${n} кл. = ${cost}${ic('money')}`;
    return;
  }
  if (hover < 0) return;
  if (!st.players[name]) { // choosing the start: outline the square a click would take
    const [x0, y0] = Game.startCorner(hover);
    let taken = false;
    for (let y = y0; y < y0 + START; y++) for (let x = x0; x < x0 + START; x++) taken = taken || !!st.owner[y * W + x];
    outline(x0, y0, x0 + START, y0 + START, taken ? '#f66' : '#ff3', null, 3);
    return;
  }
  const t = st.grid[hover], own = Game.ownerOf(st, hover) === name, hx = hover % W, hy = (hover / W) | 0;

  outline(hx, hy, hx + 1, hy + 1, tool === 'info' ? '#fffa' : free ? '#9f9' : '#f66', null, 2);
}

// nearest road tile within rad of tile i (zone homes may stand up to 3 tiles from a road)
function roadNear(i, rad = 1) {
  const x = i % W, y = (i / W) | 0;
  let best = -1, bd = 99;
  for (let dy = -rad; dy <= rad; dy++) for (let dx = -rad; dx <= rad; dx++) {
    const X = x + dx, Y = y + dy, d = Math.abs(dx) + Math.abs(dy);
    if (X >= 0 && Y >= 0 && X < W && Y < H && st.grid[Y * W + X] === 'road' && d < bd) { bd = d; best = Y * W + X; }
  }
  return best;
}

// after the map changed: road networks and the places traffic goes between
function trafficRebuild() {
  const g = st.grid, comp = new Array(g.length).fill(-1);
  let c = 0;
  g.forEach((t, i) => {
    if (t !== 'road' || comp[i] >= 0) return;
    const q = [i]; comp[i] = c;
    while (q.length) { const k = q.pop(); for (const [dx, dy] of D) { const j = nbr(k, dx, dy); if (j >= 0 && g[j] === 'road' && comp[j] < 0) { comp[j] = c; q.push(j); } } }
    c++;
  });
  traffic.comp = comp;
  const list = f => g.flatMap((t, i) => B[t] && !st.status[i] && f(t, B[t]) ? [[i, roadNear(i, B[t].zone || B[t].grown ? 3 : 1)]] : []).filter(([, r]) => r >= 0);
  traffic.homes = list((t, b) => b.home);
  traffic.works = list((t, b) => b.jobs);
  traffic.shops = list(t => t === 'shop');
  traffic.producers = list((t, b) => b.prod && Object.keys(b.prod).some(k => CARGO[k]));
  traffic.stops = list(t => t === 'stop');
  // drop agents whose route lost a road
  traffic.agents = traffic.agents.filter(a => a.kind === 'truck' || a.path.every(i => g[i] === 'road'));
}

// shortest road route between two road tiles, or null
function route(from, to) {
  if (from === to || traffic.comp[from] < 0 || traffic.comp[from] !== traffic.comp[to]) return null;
  const prev = new Map([[from, -1]]), q = [from];
  for (let h = 0; h < q.length; h++) {
    const k = q[h];
    if (k === to) break;
    for (const [dx, dy] of D) { const j = nbr(k, dx, dy); if (j >= 0 && st.grid[j] === 'road' && !prev.has(j)) { prev.set(j, k); q.push(j); } }
  }
  if (!prev.has(to)) return null;
  const p = [];
  for (let k = to; k >= 0; k = prev.get(k)) p.push(k);
  return p.reverse();
}

const sameNet = (list, road) => list.filter(([, r]) => traffic.comp[r] === traffic.comp[road] && r !== road);
function spawn(kind) {
  const T = traffic;
  let a = null;
  if (kind === 'bus') {
    const [, s1] = pickR(T.stops), others = sameNet(T.stops, s1);
    if (others.length) a = { kind, path: route(s1, pickR(others)[1]), speed: 1.1, loop: true, color: '#e8b923' };
  } else if (kind === 'car') {
    const [, r] = pickR(T.homes), dest = sameNet(T.works, r);
    if (dest.length) a = { kind, path: route(r, pickR(dest)[1]), speed: 1.4, color: pickR(CAR_COLORS) };
  } else {
    const [, r] = pickR(T.homes), dest = sameNet(T.works.concat(T.shops, T.homes), r).filter(([, d]) => Math.abs(d % W - r % W) + Math.abs((d / W | 0) - (r / W | 0)) < 14);
    if (dest.length) a = { kind, path: route(r, pickR(dest)[1]), speed: 0.35, side: Math.random() < 0.5 ? 1 : -1, skin: pickR(SKIN), shirt: pickR(SHIRT), ph: Math.random() * 6 };
  }
  if (a && a.path && a.path.length > 1) { a.k = 0; a.f = 0; a.wait = 0; T.agents.push(a); }
}

// how many of each kind the city supports right now (all players together)
function trafficWanted() {
  const ps = Object.values(st.players), pop = ps.reduce((n, p) => n + p.pop, 0), workers = ps.reduce((n, p) => n + (p.workers || 0), 0);
  return {
    ped: traffic.homes.length ? Math.min(50, Math.round(pop / 8)) : 0,
    car: traffic.works.length && traffic.homes.length ? Math.min(12, Math.round(workers / 30)) : 0,
    bus: traffic.stops.length > 1 ? Math.min(20, traffic.stops.length >> 1) : 0,
  };
}

// Trucks are the server's real shipments (game.js ship()): each one is on the road from t0 to at,
// in ticks; tickClock is how far the current tick has gone (0..1), so trucks move smoothly between states.
let tickClock = 0, clockTick = -1;
function syncTrucks() {
  const live = new Map((st.ships || []).map(sh => [sh.id, sh]));
  traffic.agents = traffic.agents.filter(a => a.kind !== 'truck' || live.has(a.ship.id));
  const have = new Set(traffic.agents.filter(a => a.kind === 'truck').map(a => a.ship.id));
  for (const sh of live.values()) {
    if (have.has(sh.id)) continue;
    const path = route(sh.from, sh.to);
    if (path) traffic.agents.push({ kind: 'truck', ship: sh, path, k: 0, f: 0, cargo: CARGO[sh.res] });
  }
}

function trafficStep(dt) {
  const T = traffic, want = trafficWanted(), have = { ped: 0, car: 0, bus: 0 };
  for (const a of T.agents) if (a.kind in have) have[a.kind]++;
  for (const kind in want) if (have[kind] < want[kind] && Math.random() < 0.05) spawn(kind); // trickle in, no bursts
  if (st.tick !== clockTick) { clockTick = st.tick; tickClock = 0; }
  tickClock = Math.min(1, tickClock + dt / 2); // a tick is 2 s at speed 1; dt is already scaled by speed
  for (const a of T.agents) if (a.kind === 'truck') { // the state's tick is already counted when a shipment is sent
    const p = Math.max(0, Math.min(1, (st.tick - 1 - a.ship.t0 + tickClock) / (a.ship.at - a.ship.t0))) * (a.path.length - 1);
    a.k = Math.min(a.path.length - 2, Math.floor(p)); a.f = p - a.k;
  }
  if (!dt) return;
  T.agents = T.agents.filter(a => {
    if (a.kind === 'truck') return true;
    if (a.kind === 'ped') a.ph += dt * 9;
    if (a.wait > 0) { a.wait -= dt; return true; }
    a.f += a.speed * dt;
    while (a.f >= 1) {
      a.f -= 1; a.k++;
      if (a.k >= a.path.length - 1) {
        if (!a.loop) return false; // delivered / arrived
        a.path.reverse(); a.k = 0; a.f = 0; a.wait = 1.5; // bus stands at the stop, then goes back
        break;
      }
    }
    return true;
  });
}

// tile-space position of an agent between the centres of its current and next tile, and its heading
function agentPos(a) {
  const p = a.path[a.k], q = a.path[Math.min(a.k + 1, a.path.length - 1)];
  const px = p % W, py = (p / W) | 0, qx = q % W, qy = (q / W) | 0;
  let dx = qx - px, dy = qy - py;
  if (!dx && !dy) dx = 1;
  const off = a.kind === 'ped' ? 0.38 * a.side : 0.13; // vehicles keep to the right, people walk on the kerb
  return [px + dx * a.f + 0.5 - dy * off, py + dy * a.f + 0.5 + dx * off, dx, dy];
}

function drawAgent(a, fx, fy, dx, dy) {
  gx = ctx;
  if (a.kind === 'ped') {
    const [x, y] = P(fx, fy), k = S / 20, sw = Math.sin(a.ph) * 1.2 * k;
    ctx.strokeStyle = '#2b2b33'; ctx.lineWidth = Math.max(1, k); ctx.beginPath();
    ctx.moveTo(x, y - 3 * k); ctx.lineTo(x - 0.8 * k + sw, y); ctx.moveTo(x, y - 3 * k); ctx.lineTo(x + 0.8 * k - sw, y); ctx.stroke();
    ctx.fillStyle = a.shirt; ctx.fillRect(x - 1.3 * k, y - 6.5 * k, 2.6 * k, 3.8 * k);
    dot(a.skin, [x, y - 8 * k], 1.6 * k);
    return;
  }
  const len = a.kind === 'bus' ? 0.5 : a.kind === 'truck' ? 0.42 : 0.3, wid = a.kind === 'car' ? 0.15 : 0.18, h = a.kind === 'car' ? 0.12 : 0.2;
  const [x0, y0, x1, y1] = dx ? [fx - len / 2, fy - wid / 2, fx + len / 2, fy + wid / 2] : [fx - wid / 2, fy - len / 2, fx + wid / 2, fy + len / 2];
  flat(x0 + 0.05, y0 + 0.05, x1 + 0.05, y1 + 0.05, 0, 'rgba(0,0,0,.3)');
  if (a.kind === 'truck') { // red cab in front, load box behind it in the cargo's colour
    const c = 0.12, cab = dx > 0 ? [x1 - c, y0, x1, y1] : dx < 0 ? [x0, y0, x0 + c, y1] : dy > 0 ? [x0, y1 - c, x1, y1] : [x0, y0, x1, y0 + c];
    const load = dx > 0 ? [x0, y0, x1 - c, y1] : dx < 0 ? [x0 + c, y0, x1, y1] : dy > 0 ? [x0, y0, x1, y1 - c] : [x0, y0 + c, x1, y1];
    block(...load, h + 0.04, a.cargo); block(...cab, h - 0.02, '#c0392b');
  } else {
    block(x0, y0, x1, y1, h, a.color);
    const ins = a.kind === 'bus' ? 0.02 : 0.05;
    block(x0 + ins, y0 + ins, x1 - ins, y1 - ins, a.kind === 'bus' ? 0.02 : 0.07, '#bfe3ff', h);
  }
}

function drawTraffic(vx, vy, vw, vh) {
  for (const a of traffic.agents) {
    const [fx, fy, dx, dy] = agentPos(a), [x, y] = P(fx, fy);
    if (x > vx - S && y > vy - S && x < vx + vw + S && y < vy + vh + 2 * S) drawAgent(a, fx, fy, dx, dy); // only what is on screen
  }
}

// one loop draws the visible part of the map every frame so traffic moves smoothly; game speed scales it, pause stops it
let lastFrame = 0;
function frameLoop(t) {
  const dt = Math.min(0.1, (t - lastFrame) / 1000 || 0);
  lastFrame = t;
  if (st) { trafficStep(dt * (st.speed ?? 1)); draw(); }
  requestAnimationFrame(frameLoop);
}
requestAnimationFrame(frameLoop);

// keeps the point under the middle of the view in place; the map canvas is (W + H) diamonds wide.
// S stays at 32 or below: the two map-sized canvases grow with the square of it.
let zoomed = false;
function setZoom(n) {
  const m = $('map');
  const u = zoomed ? (m.scrollLeft + m.clientWidth / 2 - OX) / S : (W - H) / 2; // u = x - y, v = x + y of the middle
  const v = zoomed ? (m.scrollTop + m.clientHeight / 2 - OY) / (S / 2) : (W + H) / 2;
  S = Math.max(10, Math.min(32, n)); zoomed = true;
  OX = H * S; OY = MT * S;
  c.width = base.width = (W + H) * S; c.height = base.height = (W + H) * S / 2 + MT * S;

}

function msg(m) {
  if (!net) return;
  net.send(m).then(err => { $('err').textContent = err || ''; }).catch(() => { $('err').textContent = 'нет связи'; });
}
const doAct = (tool, i, j) => msg({ type: 'act', tool, i, j });
$('speed').onclick = e => { const b = e.target.closest('[data-v]'); if (b) msg({ type: 'speed', v: +b.dataset.v }); };
// screen point → tile on the ground: invert P() with u = x - y and v = x + y
const tileAt = e => {
  const r = c.getBoundingClientRect(), u = (e.clientX - r.left - OX) / S, v = (e.clientY - r.top - OY) / (S / 2);
  const x = Math.floor((u + v) / 2), y = Math.floor((v - u) / 2);
  return x >= 0 && y >= 0 && x < W && y < H ? y * W + x : -1;
};
c.oncontextmenu = e => e.preventDefault();
c.onmousedown = e => {
  const i = tileAt(e); if (i < 0) return;
  const t = e.button === 2 ? 'bulldoze' : tool;
  last = i;
  if (!st.players[name] && st.phase !== 'lobby' && e.button === 0) return doAct('claim', i); // no land yet: a click takes the start square around it
  if (t === 'info') return;
  if ((B[t] && B[t].zone) || t === 'clear' || t === 'buy') { sel = i; draw(); return; } // zones, clearing and land: select a rectangle, applied on release
  drag = t; doAct(t, i);
};
c.onmousemove = e => {
  hover = tileAt(e); mx = e.clientX; my = e.clientY;
  if (hover >= 0 && sel >= 0) last = hover;
  draw(); hoverCard();
  // only lines and demolition are painted by dragging, so a stray drag doesn't spend money on buildings
  if (drag && hover >= 0 && hover !== last && (drag === 'bulldoze' || !B[drag].needs)) { last = hover; doAct(drag, hover); }
};
window.onmouseup = () => {
  if (sel >= 0) { doAct(tool, sel, last); sel = -1; draw(); }
  drag = false;
};
c.onmouseleave = () => { hover = -1; draw(); hoverCard(); };

$('restart').onclick = () => {
  if (confirm('Начать новый город? Текущий город удалится у всех игроков.'))
    msg({ type: 'restart' });
};

let reach = new Set(); // homes that can get to work, computed once per state for the hover window
// states can arrive faster than the screen redraws (dragging roads, fast game speed): draw only the latest, once per frame
let frame = 0;
const onState = x => {
  st = x;
  if (!frame) frame = requestAnimationFrame(() => { frame = 0; reach = Game.commute(st); render(); syncTrucks(); });
};

// Played from our Node server: state comes over SSE, commands go to /msg.
function serverNet() {
  let es;
  const open = () => {
    if (es) es.close();
    es = new EventSource('events?name=' + encodeURIComponent(name));
    es.onmessage = e => onState(JSON.parse(e.data));
    es.onerror = () => { $('err').textContent = 'переподключение…'; };
  };
  open();
  return { send: m => fetch('msg', { method: 'POST', body: JSON.stringify({ ...m, name }) }).then(r => r.json()).then(d => d.err), rename: open };
}

// Without a server: one player's browser hosts the game, others join over WebRTC by swapping codes by hand.
const ICE = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
const iceDone = pc => new Promise(r => {
  if (pc.iceGatheringState === 'complete') return r();
  pc.onicegatheringstatechange = () => pc.iceGatheringState === 'complete' && r();
  setTimeout(r, 4000); // enough candidates by now even if gathering never reports complete
});
async function pack(desc) {
  const z = new Blob([JSON.stringify(desc)]).stream().pipeThrough(new CompressionStream('deflate-raw'));
  const b = new Uint8Array(await new Response(z).arrayBuffer());
  let t = ''; for (const x of b) t += String.fromCharCode(x);
  return btoa(t);
}
async function unpack(code) {
  const b = Uint8Array.from(atob(code.trim()), ch => ch.charCodeAt(0));
  const z = new Blob([b]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return JSON.parse(await new Response(z).text());
}

function hostNet() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem('city-host')); } catch {}
  const R = Game.room(saved && saved.owner && saved.grid.length === W * H ? saved : Game.newGame());
  R.s.status = Game.compute(R.s);
  R.join('host', name);
  const peers = new Map(); // connection id -> data channel
  const keep = () => { try { localStorage.setItem('city-host', JSON.stringify(R.s)); } catch {} };
  const push = () => {
    const v = R.view(), txt = JSON.stringify({ state: v });
    onState(v);
    for (const dc of peers.values()) if (dc.readyState === 'open') dc.send(txt);
  };
  setInterval(() => { if (R.step()) { push(); if (R.s.tick % 5 === 0) keep(); } }, 500);
  async function invite() {
    const id = 'p' + Math.random().toString(36).slice(2), pc = new RTCPeerConnection(ICE), dc = pc.createDataChannel('city');
    peers.set(id, dc);
    dc.onmessage = e => {
      let d; try { d = JSON.parse(e.data); } catch { return; }
      if (d.hello !== undefined) R.join(id, d.hello);
      else if (R.online.has(id)) dc.send(JSON.stringify({ id: d.id, err: R.handle(R.online.get(id).name, d.m) }));
      push();
    };
    dc.onclose = () => { peers.delete(id); R.leave(id); push(); };
    await pc.setLocalDescription(await pc.createOffer());
    await iceDone(pc);
    return { code: await pack(pc.localDescription), accept: async answer => pc.setRemoteDescription(await unpack(answer)) };
  }
  push();
  return {
    send: m => { const err = R.handle(name, m); if (m.type === 'restart') keep(); push(); return Promise.resolve(err); },
    rename: () => { R.join('host', name); push(); },
    invite,
  };
}

async function guestNet(offer) {
  const pc = new RTCPeerConnection(ICE), pending = new Map();
  let seq = 0, dc = null;
  pc.ondatachannel = e => {
    dc = e.channel;
    dc.onopen = () => { dc.send(JSON.stringify({ hello: name })); $('netbox').style.display = 'none'; };
    dc.onmessage = ev => {
      const d = JSON.parse(ev.data);
      if (d.state) onState(d.state);
      else if (pending.has(d.id)) { pending.get(d.id)(d.err); pending.delete(d.id); }
    };
    dc.onclose = () => { $('err').textContent = 'связь с хостом потеряна — обновите страницу и подключитесь снова'; };
  };
  await pc.setRemoteDescription(await unpack(offer));
  await pc.setLocalDescription(await pc.createAnswer());
  await iceDone(pc);
  return {
    answer: await pack(pc.localDescription),
    send: m => new Promise((ok, fail) => {
      if (!dc || dc.readyState !== 'open') return fail();
      const id = ++seq; pending.set(id, ok); dc.send(JSON.stringify({ id, m }));
    }),
    rename: () => { if (dc && dc.readyState === 'open') dc.send(JSON.stringify({ hello: name })); },
  };
}

// start screen when the page isn't served by our Node server (e.g. GitHub Pages or a local file)
const box = html => { $('netStep').innerHTML = html; $('netbox').style.display = 'flex'; };
const copyBtn = id => `<button onclick="navigator.clipboard && navigator.clipboard.writeText(document.getElementById('${id}').value)">${ic('copy')} Скопировать код</button>`;
function netMenu() {
  box(`<h3>${ic('city')} Город вместе</h3>Сервер не найден — играем прямо в браузере. Один игрок создаёт игру и хранит город у себя, остальные подключаются по кодам.
    <button id="hostBtn">${ic('host')} Создать игру (я хост)</button><button id="joinBtn">${ic('join')} Подключиться к игре</button>`);
  $('hostBtn').onclick = () => { $('netbox').style.display = 'none'; net = hostNet(); hostInviteUi(); };
  $('joinBtn').onclick = () => {
    box(`<b>Подключение</b><br>1. Вставьте код приглашения от хоста:<textarea id="offerIn"></textarea><button id="answerBtn">Получить код ответа</button><div id="answerOut"></div>`);
    $('answerBtn').onclick = async () => {
      $('answerOut').textContent = 'Готовим код…';
      try {
        const g = await guestNet($('offerIn').value);
        net = g;
        $('answerOut').innerHTML = `2. Отправьте хосту этот код ответа:<textarea id="answerCode" readonly>${g.answer}</textarea>${copyBtn('answerCode')}3. Ждём, пока хост вставит его…`;
      } catch { $('answerOut').textContent = 'Код не подошёл — скопируйте его целиком'; }
    };
  };
}
function hostInviteUi() {
  $('invite').innerHTML = '<b>Вы хост.</b> Город хранится в этом браузере — не закрывайте вкладку, пока идёт игра.<button id="inviteBtn">' + ic('invite') + ' Пригласить игрока</button><div id="inviteStep"></div>';
  $('inviteBtn').onclick = async () => {
    $('inviteStep').textContent = 'Готовим код…';
    const inv = await net.invite();
    $('inviteStep').innerHTML = `1. Отправьте игроку код приглашения:<textarea id="offerCode" readonly>${inv.code}</textarea>${copyBtn('offerCode')}
      2. Вставьте его код ответа:<textarea id="answerIn"></textarea><button id="acceptBtn">Подключить</button>`;
    $('acceptBtn').onclick = async () => {
      try { await inv.accept($('answerIn').value); $('inviteStep').textContent = 'Подключаем… игрок появится в списке.'; }
      catch { $('inviteStep').insertAdjacentHTML('beforeend', '<div class="down">Код ответа не подошёл</div>'); }
    };
  };
}

fetch('hello').then(r => r.ok ? r.text() : '').catch(() => '').then(t => { if (t === 'city') net = serverNet(); else netMenu(); });
</script>
